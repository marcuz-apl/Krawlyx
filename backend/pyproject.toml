[project]
name = "mykrawl"
version = "0.1.0"
description = "MyKrawl backend API — self-hosted web scraping workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "apscheduler>=3.11,<4",
    "bcrypt>=4.2,<5",
    "itsdangerous>=2.2,<3",
    "cryptography>=43,<46",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12",
]

# Static files are served from ../frontend/dist (built by `npm run build`).
[tool.setuptools.package-data]
app = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern calls Depends() in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
